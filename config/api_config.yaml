# NextentCreator API 配置文件
# 支持多种大模型 API 接入

# ==================== LLM API 配置 ====================
# 选择你要使用的 LLM 提供商: openai, claude, wenxin, qwen, deepseek
LLM_PROVIDER: "openai"

# ==================== OpenAI 配置 ====================
OPENAI_API_KEY: "your-openai-api-key-here"
OPENAI_BASE_URL: "https://api.openai.com/v1"
OPENAI_MODEL: "gpt-4o-mini"  # 可选: gpt-4o, gpt-4-turbo, gpt-3.5-turbo

# ==================== Claude 配置 ====================
CLAUDE_API_KEY: "your-claude-api-key-here"
CLAUDE_BASE_URL: "https://api.anthropic.com/v1"
CLAUDE_MODEL: "claude-3-haiku-20240307"  # 可选: claude-3-opus, claude-3-sonnet

# ==================== 文心一言配置 ====================
WENXIN_API_KEY: "your-wenxin-api-key-here"
WENXIN_SECRET_KEY: "your-wenxin-secret-key-here"
WENXIN_MODEL: "ERNIE-Bot-4"  # 可选: ERNIE-Bot, ERNIE-Bot-turbo

# ==================== 通义千问配置 ====================
QWEN_API_KEY: "your-qwen-api-key-here"
QWEN_BASE_URL: "https://dashscope.aliyuncs.com/api/v1"
QWEN_MODEL: "qwen-turbo"  # 可选: qwen-plus, qwen-max

# ==================== DeepSeek 配置 ====================
DEEPSEEK_API_KEY: "your-deepseek-api-key-here"
DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
DEEPSEEK_MODEL: "deepseek-chat"

# ==================== 通用配置 ====================
MAX_TOKENS: 3000  # 最大生成 token 数
TEMPERATURE: 0.7  # 生成温度 (0-1)
TIMEOUT: 60  # API 请求超时时间（秒）

# ==================== 服务配置 ====================
# Python Agent 服务配置
AGENT_HOST: "0.0.0.0"
AGENT_PORT: 8000

# PHP API 网关配置
PHP_API_URL: "http://localhost/NextentCreator/backend/api"
